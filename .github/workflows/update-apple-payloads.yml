name: Update Apple Static Payloads

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: electric-eye-apple-static-payloads
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: supersonic-scraper
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export READY Apple payloads
        run: python scripts/export_apple_payloads.py

      - name: Check out archive branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: archive-site
          fetch-depth: 0

      - name: Publish Apple payloads to archive host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-site/proof
          find archive-site/proof -maxdepth 1 -type f -name 'apple-payload-*.js' -delete
          rm -f archive-site/proof/apple-payload-manifest.json
          cp output/automation/apple-payload-*.js archive-site/proof/
          cp output/automation/apple-payload-manifest.json archive-site/proof/
          cd archive-site
          if git diff --quiet -- proof; then
            echo "No archive payload changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A proof
          git commit -m "Refresh static Apple payloads"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
