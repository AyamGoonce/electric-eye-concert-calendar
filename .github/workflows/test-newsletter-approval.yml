name: Test Electric Eye Newsletter Approval

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electric-eye-newsletter-publication
  cancel-in-progress: false

jobs:
  test-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out newsletter automation
        uses: actions/checkout@v4
        with:
          ref: supersonic-scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process W42 approval
        env:
          NEWSLETTER_PUBLISH_TOKEN: ${{ secrets.NEWSLETTER_PUBLISH_TOKEN }}
          ZOHO_MAIL_APP_PASSWORD: ${{ secrets.ZOHO_MAIL_APP_PASSWORD }}
          ZOHO_CAMPAIGNS_CLIENT_ID: ${{ secrets.ZOHO_CAMPAIGNS_CLIENT_ID }}
          ZOHO_CAMPAIGNS_CLIENT_SECRET: ${{ secrets.ZOHO_CAMPAIGNS_CLIENT_SECRET }}
          ZOHO_CAMPAIGNS_READ_REFRESH_TOKEN: ${{ secrets.ZOHO_CAMPAIGNS_READ_REFRESH_TOKEN }}
          ZOHO_CAMPAIGNS_CREATE_REFRESH_TOKEN: ${{ secrets.ZOHO_CAMPAIGNS_CREATE_REFRESH_TOKEN }}
        run: |
          python -m newsletter.run_approval \
            --frequency weekly \
            --identifier 2026-W42
