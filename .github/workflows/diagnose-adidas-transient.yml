name: Temporary Adidas Arena markup diagnostic

on:
  push:
    branches: [supersonic-scraper]
    paths:
      - .github/workflows/diagnose-adidas-transient.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect official programme HTML without publishing
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from concert_calendar.scrapers.adidas_arena import (
              PROGRAMME_URL, CONCERT_PROGRAMME_URL, HEADERS, parse_events,
          )
          for url in (PROGRAMME_URL, CONCERT_PROGRAMME_URL):
              print("\\nVIEW", url, flush=True)
              response = requests.get(
                  url, headers={**HEADERS, "Cache-Control": "no-cache"}, timeout=30,
              )
              print("STATUS", response.status_code, "BYTES", len(response.content), flush=True)
              response.raise_for_status()
              html = response.text
              soup = BeautifulSoup(html, "html.parser")
              cards = soup.select(".app-programmation-card")
              print("CARD COUNT", len(cards))
              print("WITHIN IN RAW HTML", "within temptation" in html.casefold())
              parsed = parse_events(soup)
              print("PARSED", len(parsed), [e.headliner for e in parsed])
              for card in cards:
                  type_node = card.select_one(".type")
                  title_node = card.select_one("h2")
                  date_node = card.select_one(".date")
                  links = card.select("a[href]")
                  title = title_node.get_text(" ", strip=True) if title_node else ""
                  typ = type_node.get_text(" ", strip=True) if type_node else ""
                  dt = date_node.get_text(" ", strip=True) if date_node else ""
                  if typ.casefold() == "concert" or "within" in title.casefold():
                      print("CARD", repr(title), repr(dt), repr(typ),
                            "CLASSES", card.get("class"), "LINKS",
                            [(a.get("class"), a.get("href")) for a in links[:3]])
              for hit in soup.find_all(
                  string=lambda x: bool(x and "within temptation" in x.casefold())
              )[:5]:
                  parent = hit.parent
                  for _ in range(4):
                      if not parent:
                          break
                      print("WITHIN NODE", parent.name, parent.get("class"),
                            repr(parent.get_text(" ", strip=True)[:160]))
                      parent = parent.parent
              where = html.casefold().find("within temptation")
              if where >= 0:
                  print("RAW CONTEXT", repr(html[max(0,where-180):where+300]))
          PY
