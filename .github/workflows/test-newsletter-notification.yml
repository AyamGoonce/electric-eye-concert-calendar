name: Test Electric Eye Newsletter Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send test notification
        env:
          ZOHO_MAIL_APP_PASSWORD: ${{ secrets.ZOHO_MAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          password = os.environ.get("ZOHO_MAIL_APP_PASSWORD")
          if not password:
              raise RuntimeError("ZOHO_MAIL_APP_PASSWORD is missing")

          message = EmailMessage()
          message["From"] = "Electric Eye Notifications <eric@electriceyerock.com>"
          message["To"] = "eric@electriceyerock.com"
          message["Subject"] = "Electric Eye — Notification System Test"

          message.set_content(
              "This is a test of the Electric Eye newsletter "
              "approval notification system.\n\n"
              "GitHub Actions successfully connected to Zoho Mail."
          )

          context = ssl.create_default_context()

          with smtplib.SMTP_SSL(
              "smtppro.zoho.eu",
              465,
              context=context,
              timeout=30,
          ) as smtp:
              smtp.login("eric@electriceyerock.com", password)
              smtp.send_message(message)

          print("SUCCESS: Test notification accepted by Zoho SMTP.")
          PY
