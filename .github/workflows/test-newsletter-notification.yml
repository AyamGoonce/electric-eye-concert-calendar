name: Test Electric Eye Newsletter Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send approval notification test
        env:
          ZOHO_MAIL_APP_PASSWORD: ${{ secrets.ZOHO_MAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          from newsletter.zoho_campaigns import (
              campaign_name,
              campaign_editor_url,
          )
          from newsletter.zoho_notification import send_approval_notification

          campaign_id = "221575000000113002"

          campaign = {
              "frequency": "weekly",
              "identifier": "2026-W42",
              "campaign_name": campaign_name("weekly", "2026-W42"),
              "campaign_id": campaign_id,
              "campaign_status": "Draft",
              "editor_url": campaign_editor_url(campaign_id),
          }

          result = send_approval_notification(campaign)

          print("SUCCESS: Approval notification accepted by Zoho SMTP.")
          print("Recipient:", result["recipient"])
          print("Campaign ID:", result["campaign_id"])
          PYTHON
