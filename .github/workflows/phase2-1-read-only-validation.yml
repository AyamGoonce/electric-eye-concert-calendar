name: Phase 2.1 Read-only Full Pipeline Validation
on:
  push:
    branches:
      - phase2-1-structured-roster-reconciliation
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Seed genre resolution cache
        run: |
          mkdir -p output
          cp concert_calendar/data/genre_cache_seed/*.json output/
      - name: Check out published baseline (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - name: Build without publication
        run: |
          python -m concert_calendar.automation build \
            --output-dir output/phase21-dry-run \
            --published-pointer pages/proof/calendar-current.js \
            --published-state pages/proof/calendar-state.json
      - name: Upload diagnostics (never publish)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase21-dry-run-report-${{ github.run_id }}
          path: output/phase21-dry-run/automation-report.json
          if-no-files-found: warn
          retention-days: 7
