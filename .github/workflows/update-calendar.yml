name: Update Electric Eye Concert Calendar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_large_count_change:
        description: Allow a deliberately reviewed event-count change outside the safety range
        required: false
        type: boolean
        default: false
      validation_failure_test:
        description: Build and fail validation deliberately without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: electric-eye-calendar-production
  cancel-in-progress: false

jobs:
  update-calendar:
    name: Scrape, validate, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out automation source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check out current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Build and validate live calendar
        id: build
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_count_change || 'false' }}
          FAILURE_TEST: ${{ inputs.validation_failure_test || 'false' }}
        run: |
          arguments=(
            --output-dir output/automation
            --published-pointer pages/proof/calendar-current.js
          )
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then
            arguments+=(--allow-large-count-change)
          fi
          if [[ "$FAILURE_TEST" == "true" ]]; then
            arguments+=(--simulate-validation-failure)
          fi
          python -m concert_calendar.automation build "${arguments[@]}"

      - name: Stage validated Pages publication
        run: >-
          python -m concert_calendar.automation publish
          --generated-dir output/automation
          --pages-dir pages

      - name: Commit and push Pages update
        id: publish
        working-directory: pages
        run: |
          if [[ -z "$(git status --porcelain -- proof)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A proof
          git commit -m "Update calendar data (${{ steps.build.outputs.event_count }} events)"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify hosted publication
        run: >-
          python -m concert_calendar.automation verify-hosted
          --base-url https://ayamgoonce.github.io/electric-eye-concert-calendar/proof
          --sha256 "${{ steps.build.outputs.sha256 }}"

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-production-report-${{ github.run_id }}
          path: output/automation/automation-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write run summary
        if: success()
        run: |
          {
            echo "## Electric Eye calendar publication"
            echo ""
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Raw events: ${{ steps.build.outputs.raw_count }}"
            echo "- IDF events: ${{ steps.build.outputs.idf_count }}"
            echo "- Published events: ${{ steps.build.outputs.event_count }}"
            echo "- SHA-256: \`${{ steps.build.outputs.sha256 }}\`"
            echo "- Pages changed: ${{ steps.publish.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
