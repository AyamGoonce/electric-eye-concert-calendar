name: Update Electric Eye Concert Calendar

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      allow_large_count_change:
        description: Allow a deliberately reviewed event-count change outside the safety range
        required: false
        type: boolean
        default: false
      validation_failure_test:
        description: Build and fail validation deliberately without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: electric-eye-calendar-production
  cancel-in-progress: false

jobs:
  update-calendar:
    name: Scrape, validate, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run artist auto-linker regression
        run: node --test tests/artist_autolinker.test.js

      - name: Check out current Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
          persist-credentials: false

      - name: Record last-known-good Pages release
        id: baseline
        run: |
          echo "commit=$(git -C pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(python -m concert_calendar.automation pointer-digest --pointer pages/proof/calendar-current.js)" >> "$GITHUB_OUTPUT"

      - name: Build and validate live calendar
        id: build
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_count_change || 'false' }}
          FAILURE_TEST: ${{ inputs.validation_failure_test || 'false' }}
        run: |
          arguments=(
            --output-dir output/automation
            --published-pointer pages/proof/calendar-current.js
            --published-state pages/proof/calendar-state.json
          )
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then
            arguments+=(--allow-large-count-change)
          fi
          if [[ "$FAILURE_TEST" == "true" ]]; then
            arguments+=(--simulate-validation-failure)
          fi
          python -m concert_calendar.automation build "${arguments[@]}"

      - name: Check out Pages publication workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages-write
          fetch-depth: 0

      - name: Confirm publication baseline is unchanged
        run: test "$(git -C pages-write rev-parse HEAD)" = "${{ steps.baseline.outputs.commit }}"

      - name: Stage immutable candidate publication
        run: >-
          python -m concert_calendar.automation stage-candidate
          --generated-dir output/automation
          --pages-dir pages-write
          --candidate-id "${{ steps.build.outputs.sha256 }}-${{ github.run_id }}"

      - name: Publish candidate without changing the live pointer
        working-directory: pages-write
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "proof/candidates/${{ steps.build.outputs.sha256 }}-${{ github.run_id }}"
          git commit -m "Stage calendar candidate (${{ steps.build.outputs.event_count }} events)"
          git push origin HEAD:gh-pages

      - name: Verify candidate and stage live promotion
        run: >-
          python -m concert_calendar.automation promote-verified
          --candidate-dir "pages-write/proof/candidates/${{ steps.build.outputs.sha256 }}-${{ github.run_id }}"
          --pages-dir pages-write
          --base-url "https://archive.electriceyerock.com/proof/candidates/${{ steps.build.outputs.sha256 }}-${{ github.run_id }}"
          --sha256 "${{ steps.build.outputs.sha256 }}"

      - name: Promote verified candidate to live Pages
        id: publish
        working-directory: pages-write
        run: |
          git add -A proof artist concert index.html
          git commit -m "Promote verified calendar (${{ steps.build.outputs.event_count }} events)"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify final live publication
        id: final_verify
        continue-on-error: true
        run: >-
          python -m concert_calendar.automation verify-hosted
          --base-url https://archive.electriceyerock.com/proof
          --sha256 "${{ steps.build.outputs.sha256 }}"

      - name: Restore last-known-good release after final verification failure
        if: steps.final_verify.outcome == 'failure'
        working-directory: pages-write
        run: |
          git restore --source="${{ steps.baseline.outputs.commit }}" --staged --worktree -- .
          git commit -m "Rollback failed calendar publication"
          git push origin HEAD:gh-pages

      - name: Verify restored last-known-good release
        if: steps.final_verify.outcome == 'failure'
        run: >-
          python -m concert_calendar.automation verify-hosted
          --base-url https://archive.electriceyerock.com/proof
          --sha256 "${{ steps.baseline.outputs.sha256 }}"

      - name: Fail after verified rollback
        if: steps.final_verify.outcome == 'failure'
        run: exit 1

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calendar-production-report-${{ github.run_id }}
          path: output/automation/automation-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write run summary
        if: success()
        run: |
          {
            echo "## Electric Eye calendar publication"
            echo ""
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Raw events: ${{ steps.build.outputs.raw_count }}"
            echo "- IDF events: ${{ steps.build.outputs.idf_count }}"
            echo "- Published events: ${{ steps.build.outputs.event_count }}"
            echo "- Genre coverage: ${{ steps.build.outputs.genre_populated }} populated / ${{ steps.build.outputs.genre_blank }} blank (${{ steps.build.outputs.genre_coverage_percentage }}%)"
            echo "- Genre conflicts: ${{ steps.build.outputs.genre_conflict_count }}"
            echo "- New events: ${{ steps.build.outputs.new_events }}"
            echo "- No longer present: ${{ steps.build.outputs.no_longer_present }}"
            echo "- New support acts: ${{ steps.build.outputs.new_support_acts }}"
            echo "- Genre enrichments: ${{ steps.build.outputs.genre_enrichments }}"
            echo "- Ticket-status changes: ${{ steps.build.outputs.ticket_status_changes }}"
            echo "- Newly sold out: ${{ steps.build.outputs.newly_sold_out }}"
            echo "- SHA-256: \`${{ steps.build.outputs.sha256 }}\`"
            echo "- Pages changed: ${{ steps.publish.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
