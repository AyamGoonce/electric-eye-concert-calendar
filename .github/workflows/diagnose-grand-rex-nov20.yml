name: Grand Rex listings diagnostic
on:
  pull_request:
    branches:
      - supersonic-scraper
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4
      - name: Compare canonical and legacy programme pages
        shell: bash
        run: |
          python3 - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import date
          from concert_calendar.scrapers.grand_rex import parse_events, HEADERS
          urls = ("https://www.legrandrex.com/evenement", "https://www.legrandrex.com/evenement/")
          for url in urls:
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=15)
                  soup = BeautifulSoup(resp.text, "html.parser")
                  cards = soup.select(".row-event")
                  tagged = [e for e in cards if "concerts" in e.get("class", [])]
                  parsed = parse_events(soup)
                  print("URL", url, "status", resp.status_code, "final", resp.url,
                        "server",resp.headers.get("Server",""),
                        "cards",len(cards), "tagged_concerts", len(tagged), "parsed",len(parsed),
                        "titles",[e.headliner for e in parsed[:6]], "body_bytes",len(resp.content), "page_title",(soup.title.get_text(" ",strip=True) if soup.title else ""), "h3",[x.get_text(" ",strip=True)[:85] for x in soup.select("h3")[:10]], "links",[a.get("href","")[:90] for a in soup.select("a[href]")[:14]], "scripts",[x.get("src","")[:90] for x in soup.select("script[src]")[:6]],flush=True)
                  for card in soup.select("article.carte"):
                      if "so floyd" in card.get_text(" ",strip=True).casefold() or "the music of" in card.get_text(" ",strip=True).casefold():
                          print("CONCERT_HTML",str(card)[:4500],flush=True)
                          break
                  for heading in soup.select("h3")[:9]:
                      par = heading
                      chain=[]
                      for _ in range(4):
                          if par is None: break
                          chain.append({"tag":par.name,"class":par.get("class",[]),"data":{k:v for k,v in par.attrs.items() if k.startswith("data-")},"text":par.get_text(" ",strip=True)[:110]})
                          par = par.parent
                      print("HEADING_CHAIN",chain,flush=True)
                  for elem in soup.select("[data-date], time, .date, [class*=event], [class*=concert]")[:16]:
                      print("STRUCTURE",elem.name,elem.get("class",[]),{k:str(v)[:90] for k,v in elem.attrs.items() if k.startswith("data-") or k=="datetime"},elem.get_text(" ",strip=True)[:90],flush=True)
              except Exception as error:
                  print("URL",url,"error",type(error).__name__,str(error)[:140],flush=True)
          PY
