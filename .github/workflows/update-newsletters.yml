name: Publish Electric Eye Newsletters

on:
  workflow_dispatch:
    inputs:
      frequency:
        description: Newsletter edition to publish
        required: true
        type: choice
        options:
          - weekly
          - monthly
          - templates
  schedule:
    - cron: "0 6,7 * * 1"
    - cron: "0 6,7 1 * *"

permissions:
  contents: read

concurrency:
  group: electric-eye-newsletter-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out newsletter generator
        uses: actions/checkout@v4
        with:
          ref: supersonic-scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter regression tests
        run: python -m unittest discover -s tests -p 'test_newsletter_*.py'

      - name: Publish email templates
        if: github.event_name == 'workflow_dispatch' && inputs.frequency == 'templates'
        env:
          NEWSLETTER_PUBLISH_TOKEN: ${{ secrets.NEWSLETTER_PUBLISH_TOKEN }}
        run: |
          python - <<'DEPLOY_TEMPLATES'
          from newsletter.template_publish import publish_email_template

          for frequency in ("weekly", "monthly"):
              result = publish_email_template(frequency)
              print(f"{frequency.title()} template: {result['action']}")
          DEPLOY_TEMPLATES

      - name: Publish weekly edition
        id: weekly_publication
        if: (github.event_name == 'workflow_dispatch' && inputs.frequency == 'weekly') || github.event.schedule == '0 6,7 * * 1'
        env:
          NEWSLETTER_PUBLISH_TOKEN: ${{ secrets.NEWSLETTER_PUBLISH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m newsletter.run --frequency weekly --publish
          else
            python -m newsletter.run --frequency weekly --scheduled --publish
          fi

      - name: Publish monthly edition
        id: monthly_publication
        if: (github.event_name == 'workflow_dispatch' && inputs.frequency == 'monthly') || github.event.schedule == '0 6,7 1 * *'
        env:
          NEWSLETTER_PUBLISH_TOKEN: ${{ secrets.NEWSLETTER_PUBLISH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m newsletter.run --frequency monthly --publish
          else
            python -m newsletter.run --frequency monthly --scheduled --publish
          fi

      - name: Run Zoho approval automation
        if: >-
          steps.weekly_publication.outputs.identifier != '' ||
          steps.monthly_publication.outputs.identifier != ''
        env:
          NEWSLETTER_PUBLISH_TOKEN: ${{ secrets.NEWSLETTER_PUBLISH_TOKEN }}
          ZOHO_MAIL_APP_PASSWORD: ${{ secrets.ZOHO_MAIL_APP_PASSWORD }}
          ZOHO_CAMPAIGNS_CLIENT_ID: ${{ secrets.ZOHO_CAMPAIGNS_CLIENT_ID }}
          ZOHO_CAMPAIGNS_CLIENT_SECRET: ${{ secrets.ZOHO_CAMPAIGNS_CLIENT_SECRET }}
          ZOHO_CAMPAIGNS_READ_REFRESH_TOKEN: ${{ secrets.ZOHO_CAMPAIGNS_READ_REFRESH_TOKEN }}
          ZOHO_CAMPAIGNS_CREATE_REFRESH_TOKEN: ${{ secrets.ZOHO_CAMPAIGNS_CREATE_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ steps.weekly_publication.outputs.identifier }}" ]; then
            python -m newsletter.run_approval \
              --frequency weekly \
              --identifier "${{ steps.weekly_publication.outputs.identifier }}"
          fi

          if [ -n "${{ steps.monthly_publication.outputs.identifier }}" ]; then
            python -m newsletter.run_approval \
              --frequency monthly \
              --identifier "${{ steps.monthly_publication.outputs.identifier }}"
          fi
