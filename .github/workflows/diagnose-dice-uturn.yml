name: Diagnose DICE and U-Turn sources

on:
  push:
    paths:
      - .github/workflows/diagnose-dice-uturn.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe upstream public pages
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.error
          from html.parser import HTMLParser
          class Classes(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.classes={}
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k=='class' and v:
                          for cl in v.split():
                              if any(w in cl.lower() for w in ('show','date','event','ticket','venue','artist')):
                                  self.classes[cl]=self.classes.get(cl,0)+1
          for url in ['https://www.uturntouring.com/shows/','https://dice.fm/browse/paris-5b23e8a0e63cc224a4c36a2d/music/gig']:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as resp:
                      body=resp.read().decode('utf-8','replace')
                      print('URL',url,'status',resp.status,'length',len(body))
                      p=Classes();p.feed(body)
                      print('CLASS COUNTS',sorted(p.classes.items(),key=lambda x:-x[1])[:45])
                      print('UTURN OLD SELECTOR',body.count('show-full-row'))
                      if 'uturntouring' in url:
                          print('UTURN HTML HEAD',re.sub(r'\\s+',' ',body[:1800]))
                          print('UTURN BODY TEXT',re.sub(r'<[^>]+>',' ',body)[-1200:])
                      else:
                          import json
                          m=re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>',body,re.S)
                          if m:
                              data=json.loads(m.group(1))
                              print('DICE NEXT TOP KEYS',list(data))
                              print('DICE PAGE PROPS KEYS',list(data.get('props',{}).get('pageProps',{})))
                              for k,v in data.get('props',{}).get('pageProps',{}).items():
                                  if isinstance(v,dict):print('DICE PROP DICT',k,list(v)[:25])
                                  if isinstance(v,list):print('DICE PROP LIST',k,len(v))
                      print('DICE SERVER DATA',[(k,body.count(k)) for k in ['__NEXT_DATA__','__next_f','event_start_date','next_page_cursor','application/ld+json']])
              except urllib.error.HTTPError as e:
                  print('URL',url,'status',e.code,'content-type',e.headers.get('content-type'),'body',e.read(350).decode('utf-8','replace'))
              except Exception as e:
                  print('URL',url,'exception',type(e).__name__,str(e)[:200])
          PY
